name: Update SLAM datasets

on:
  schedule:
    # GitHub Actions 使用 UTC。例：UTC 01:30 = 北京时间 09:30。
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Discover and curate datasets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: python slam_dataset_updater.py --config config.yaml --catalog data/curated_datasets.yaml

      - name: Commit generated catalogue
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update robot SLAM dataset catalogue"
          file_pattern: "docs/slam-datasets.json docs/slam-datasets.md"
